services:
  db:
    image: postgres:16-alpine
    container_name: standup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: standup
      POSTGRES_USER: standup
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_db_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standup"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: standup-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://standup:${DB_PASSWORD:-changeme_db_password}@db:5432/standup
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_at_least_32_chars}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: standup-web
    restart: unless-stopped
    ports:
      - "8880:80"
    depends_on:
      - backend

volumes:
  pgdata:
