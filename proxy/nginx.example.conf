events {
  worker_connections 1024;
}

http {

  server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver (required for variable-based proxy_pass)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Keycloak — proxy /auth/ to Keycloak container
    # Uses a variable so nginx starts even if Keycloak isn't running (no SSO profile)
    location /auth/ {
      set $keycloak http://standup-keycloak:8080;
      proxy_pass $keycloak;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
    }

    # StandUp app — everything else
    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

}
